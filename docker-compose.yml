# Environnement de développement local et tests d'intégration
#
# L'API tourne sur le host (dotnet run) et se connecte à ces services via localhost:PORT.
# Versions figées — à maintenir alignées avec les manifests K3s de production.
#
# Séquence de démarrage :
#   docker compose up -d
#   dotnet ef database update --project src/NutritionApi.Infrastructure --startup-project src/NutritionApi.Api
#   psql -h localhost -p 5445 -U postgres -d nutrition_dev -f seed-dev.sql
#   dotnet run --project src/NutritionApi.Api

services:
  postgres:
    image: postgres:16
    container_name: nutrition-postgres
    environment:
      POSTGRES_DB: nutrition_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # Ports externes décalés pour ne pas entrer en conflit avec des instances
      # déjà présentes sur le poste. Les ports internes restent standards.
      - "5445:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nutrition_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: nutrition-redis
    ports:
      - "6336:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: nutrition-keycloak
    # start-dev : base H2 embarquée, pas de volume — le realm est réimporté à chaque
    # recréation du conteneur, ce qui garantit un environnement reproductible.
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      # Fige l'issuer des jetons sur l'URL vue depuis le host. Sans cela, Keycloak
      # le déduit de l'en-tête Host : un jeton obtenu depuis le host porterait
      # localhost:8778 alors que l'API conteneurisée attendrait keycloak:8080.
      KC_HOSTNAME: http://localhost:8778
      # Les appels internes (récupération des clés de signature par l'API dans le
      # réseau Docker) continuent d'utiliser le nom de service.
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "8778:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    healthcheck:
      # Le endpoint de santé est exposé sur le port de management (9000), pas sur 8080.
      # L'image ne contient ni curl ni wget : on passe par /dev/tcp de bash.
      test:
        - CMD-SHELL
        - "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep -q 'UP' <&3"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  # ── Profil « full » : API conteneurisée ──────────────────────────────────────
  # Non démarrés par défaut. `docker compose up -d` ne lance que les 3 services
  # ci-dessus (mode dev, API sur le host).
  #   docker compose --profile full up -d   → ajoute les services suivants

  migrations:
    profiles: ["full"]
    build:
      context: .
      dockerfile: Dockerfile.migrations
    container_name: nutrition-migrations
    environment:
      # Lue en priorité par DesignTimeDbContextFactory
      NUTRITION_DB_CONNECTION: "Host=postgres;Port=5432;Database=nutrition_dev;Username=postgres;Password=postgres"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    profiles: ["full"]
    build:
      context: .
      dockerfile: src/NutritionApi.Api/Dockerfile
    container_name: nutrition-api
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_HTTP_PORTS: "8080"
    ports:
      # 5100 côté host pour ne pas entrer en conflit avec l'API lancée en dotnet run (5099)
      - "5100:8080"
    depends_on:
      # L'API ne démarre qu'une fois les migrations terminées avec succès
      migrations:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
