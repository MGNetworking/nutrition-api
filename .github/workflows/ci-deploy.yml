name: CI — Deploy Production

on:
  pull_request:
    branches: [prod]
  push:
    branches: [prod]

jobs:
  build-and-test:
    name: Build Release (validation)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore nutrition-api.slnx

      - name: Build Release
        run: dotnet build nutrition-api.slnx --no-restore --configuration Release

