name: CI — Tests d'intégration externe

# Niveau 3 (NTR-28) : PostgreSQL, Redis et Keycloak réels.
#
# Le job réutilise scripts/test-integration.sh — le même script qu'en local, qui monte le même
# docker-compose.yml. Aucune définition de service propre à la CI : ce que le workflow éprouve est
# donc bien la configuration Docker du projet, ce qui est l'objet de ce niveau.
#
# Les services ne sont volontairement pas déclarés via `services:` : les conteneurs de GitHub
# Actions ne rejoueraient ni les healthchecks, ni le réseau, ni l'import de realm du compose.

on:
  pull_request:
    branches: [dev]

jobs:
  integration-tests:
    name: Tests d'intégration externe (docker-compose)
    if: github.head_ref != 'main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore nutrition-api.slnx

      - name: Build
        run: dotnet build nutrition-api.slnx --no-restore --configuration Release

      - name: Tests de niveau 3
        run: ./scripts/test-integration.sh --no-build --configuration Release --verbosity normal

      # Les journaux des trois services sont la première chose à lire quand un test échoue :
      # un realm mal importé ou une base non migrée ne se voit pas dans la sortie de dotnet test.
      - name: Journaux des services en cas d'échec
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Arrêt de la pile
        if: always()
        run: docker compose down -v
