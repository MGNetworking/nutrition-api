name: CI — Tests unitaires

on:
  pull_request:
    branches: [dev]

jobs:
  build-and-test:
    name: Build & Tests unitaires
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore nutrition-api.slnx

      - name: Build
        run: dotnet build nutrition-api.slnx --no-restore --configuration Release

      - name: Tests unitaires
        run: dotnet test nutrition-api.slnx --no-build --configuration Release --verbosity normal --settings tests/coverage.runsettings
