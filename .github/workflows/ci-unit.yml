name: CI — Tests unitaires

on:
  pull_request:
    branches: [dev]

jobs:
  build-and-test:
    name: Build & Tests unitaires
    if: github.head_ref != 'main'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      checks: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore nutrition-api.slnx

      - name: Build
        run: dotnet build nutrition-api.slnx --no-restore --configuration Release

      # Le filtre écarte le niveau 3, qui exige PostgreSQL, Redis et Keycloak réels.
      # Ces tests sont exécutés par ci-integration.yml, qui monte la pile docker-compose.
      - name: Tests unitaires et d'intégration interne
        run: dotnet test nutrition-api.slnx --no-build --configuration Release --verbosity normal --settings tests/coverage.runsettings --filter "Level!=3" --collect:"XPlat Code Coverage" --results-directory ./coverage

      # La couverture était jusqu'ici calculée par ci-release.yml seul, donc sur les pull
      # requests vers main. Une baisse n'apparaissait qu'au moment de préparer une release,
      # alors que le code fautif était dans dev depuis plusieurs jours (NTR-166).
      - name: Générer rapport de couverture
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool
          reportgenerator -reports:"coverage/**/coverage.cobertura.xml" -targetdir:"coverage/report" -reporttypes:Cobertura

      - name: Upload rapport de couverture
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-unit
          path: coverage/report

      - name: Commentaire couverture sur PR
        uses: 5monkeys/cobertura-action@v14
        with:
          path: coverage/report/Cobertura.xml
          minimum_coverage: 75
          show_line: true
          show_branch: true
          report_name: Couverture — niveaux 1 et 2
